# Update pull requests are paused so the repository keeps a single main branch; CI audits dependencies on every push.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  # The AWS provider version recorded in each example's .terraform.lock.hcl.
  - package-ecosystem: terraform
    directories:
      - /examples/compliant
      - /examples/noncompliant
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
