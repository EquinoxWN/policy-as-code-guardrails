name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action is pinned to a full commit SHA; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned OPA 1.21.2, conftest 0.71.1 and Terraform 1.16.5, each checked against the pinned
      # SHA-256 and the release's published checksums; then Rego and Terraform formatting checks.
      - run: make setup lint
      - name: Unit tests (opa test)
        run: make test
      - name: Mutation check (the unit tests must catch 12 deliberate bugs)
        run: make mutate
      # Plans the examples with no cloud credentials, exports them with terraform show -json and
      # evaluates them with conftest: the compliant plan must pass and the non-compliant plan must
      # fail with exactly examples/noncompliant/expected-violations.txt. Any other result fails this PR.
      - name: End-to-end policy check on real terraform plans
        run: make e2e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: false
      - name: Known-vulnerability audit of the tool and provider binaries (govulncheck)
        run: make audit
